name: Validate public source

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install showcase JPEG validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/lightweft-python"
          "$RUNNER_TEMP/lightweft-python/bin/python" -m pip install Pillow==12.2.0
          echo "$RUNNER_TEMP/lightweft-python/bin" >> "$GITHUB_PATH"
      - name: Check public file boundaries
        run: python3 scripts/check_public_repo.py
      - name: Test portable workflow
        run: python3 -m unittest discover -s tests -v
      - name: Test browser state, autosave and sphere geometry
        run: node --test review/tests/*.test.mjs
      - name: Check whitespace
        run: git show --format= --check HEAD
