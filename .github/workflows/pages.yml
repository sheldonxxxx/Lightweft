name: Publish photo showcase

on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'scripts/build_showcase.py'
      - 'scripts/showcase_media.py'
      - 'scripts/check_public_repo.py'
      - 'tests/test_showcase.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'showcase/**'
      - 'scripts/build_showcase.py'
      - 'scripts/showcase_media.py'
      - 'scripts/check_public_repo.py'
      - 'tests/test_showcase.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install JPEG validation dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/showcase-python"
          "$RUNNER_TEMP/showcase-python/bin/python" -m pip install Pillow==12.2.0
      - name: Validate public source and JPEG metadata
        run: '"$RUNNER_TEMP/showcase-python/bin/python" scripts/check_public_repo.py'
      - name: Test media boundaries and gallery build
        run: '"$RUNNER_TEMP/showcase-python/bin/python" -m unittest discover -s tests -p test_showcase.py -v'
      - name: Build the static site
        run: '"$RUNNER_TEMP/showcase-python/bin/python" scripts/build_showcase.py'
      - name: Upload only the site output
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the validated site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
