<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="660" viewBox="0 0 1600 660" role="img" aria-labelledby="title desc">
  <title id="title">Lightweft — pro-level photo editing. Just talk to your AI.</title>
  <desc id="desc">Lightweft guides your AI to plan edits, create your presets, review results and refine them with your feedback. A separately connected photo library, such as Immich, supplies photographs. The optional RapidRAW MCP companion edits and exports them, returning results for review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="m1 1 8 4-8 4" fill="none" stroke="#cdb873" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1600" height="660" rx="14" fill="#0a1513"/>
  <g fill="none" stroke="#cdb873" stroke-width="2.2" stroke-linecap="round">
    <path d="M66 58h28m-14-14v28M70 48l20 20m0-20L70 68"/>
  </g>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#eeeade">
    <text x="108" y="71" font-size="40">Lightweft</text>
    <text x="64" y="171" font-size="70" letter-spacing="-1.5">Pro-level photo editing.</text>
    <text x="64" y="250" font-size="70" letter-spacing="-1.5">Just talk to your AI.</text>
  </g>
  <path d="M64 290H1536" stroke="#35443b"/>

  <rect x="64" y="352" width="280" height="180" rx="10" fill="#0c1b17" stroke="#465249" stroke-width="1.5"/>
  <rect x="440" y="326" width="720" height="220" rx="10" fill="#11271f" stroke="#cdb873" stroke-width="2"/>
  <rect x="1256" y="352" width="280" height="180" rx="10" fill="#0c1b17" stroke="#465249" stroke-width="1.5"/>

  <g font-family="Georgia, 'Times New Roman', serif" fill="#eeeade">
    <text x="90" y="405" font-size="32">Photo library</text>
    <text x="480" y="384" font-size="39">Lightweft guides your AI</text>
    <text x="1282" y="432" font-size="28">RapidRAW MCP</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="90" y="449" fill="#eeeade" font-size="25">e.g. Immich</text>
    <text x="90" y="493" fill="#b4beb3" font-size="22">Supplies photos</text>
    <text x="480" y="441" fill="#eeeade" font-size="26">Plan edits · Create your presets</text>
    <text x="480" y="493" fill="#eeeade" font-size="26">Review results · Refine together</text>
